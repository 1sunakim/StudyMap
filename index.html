<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 课程知识地图原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">学</span>
          <div>
            <h1>课程知识地图</h1>
            <p>面向大学生的 AI 导图笔记原型</p>
          </div>
        </div>

        <section class="course-panel">
          <label for="mapSelector">当前思维导图</label>
          <select id="mapSelector"></select>

          <label for="courseName">课程</label>
          <div class="course-row">
            <input id="courseName" value="数据结构" />
            <button id="buildDemoMap" type="button">生成</button>
          </div>
        </section>

        <section class="metric-grid" aria-label="学习状态">
          <div>
            <strong id="nodeCount">0</strong>
            <span>知识点</span>
          </div>
          <div>
            <strong id="masteredCount">0</strong>
            <span>已掌握</span>
          </div>
          <div>
            <strong id="weakCount">0</strong>
            <span>待复习</span>
          </div>
        </section>

        <section class="actions">
          <button id="newMap" type="button">新建思维导图</button>
          <button id="importMap" type="button">导入思维导图</button>
          <button id="generateReview" type="button">生成复习清单</button>
          <button id="exportJson" type="button">导出 JSON</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </section>

        <section class="review-box">
          <h2>复习清单</h2>
          <ul id="reviewList"></ul>
        </section>

        <section class="learning-chain-box">
          <h2>知识点学习链</h2>
          <ol id="learningChain" class="learning-chain"></ol>
        </section>
      </aside>

      <section class="map-stage">
        <header class="stage-header">
          <div>
            <span class="eyebrow">Mind Map</span>
            <h2 id="mapTitle">数据结构知识地图</h2>
          </div>
          <div class="legend">
            <span><i class="dot new"></i>未学</span>
            <span><i class="dot learning"></i>学习中</span>
            <span><i class="dot mastered"></i>已掌握</span>
          </div>
        </header>

        <div class="map-toolbar" aria-label="地图工具">
          <button id="addChild" type="button">添加子知识点</button>
          <button id="deleteNode" class="danger-button" type="button">删除知识点</button>
          <label class="zoom-control" for="zoomRange">
            缩放
            <input id="zoomRange" type="range" min="50" max="150" value="100" />
            <span id="zoomValue">100%</span>
          </label>
        </div>

        <div id="mapViewport" class="map-viewport" aria-label="可拖动知识地图画布">
          <div id="mindMap" class="mind-map"></div>
        </div>
      </section>

      <aside class="detail-panel">
        <div class="detail-header">
          <div>
            <span class="eyebrow">Knowledge Card</span>
            <input id="nodeTitle" class="title-input" />
          </div>
          <select id="nodeStatus" aria-label="掌握状态">
            <option value="new">未学</option>
            <option value="learning">学习中</option>
            <option value="mastered">已掌握</option>
          </select>
        </div>

        <label class="field-label" for="nodeIntro">知识点介绍</label>
        <textarea
          id="nodeIntro"
          class="compact-textarea"
          spellcheck="false"
          placeholder="示例：在这里记录概念定义、适用场景、公式推导、易错点或自己的理解。输入内容后，这段提示会自动消失。"
        ></textarea>

        <label class="field-label" for="nodeQuestions">题目与例题</label>
        <textarea
          id="nodeQuestions"
          class="compact-textarea"
          spellcheck="false"
          placeholder="示例：在这里放课堂例题、自测题、解题步骤或考试常见题型。"
        ></textarea>

        <section class="ai-draft-box">
          <div class="section-title-row">
            <h2>AI 临时草稿</h2>
            <span id="draftType">等待生成</span>
          </div>
          <textarea
            id="aiDraft"
            spellcheck="false"
            placeholder="AI 生成的解释或题目会先出现在这里。确认后再放入正式文本。"
          ></textarea>
          <div class="draft-actions">
            <button id="applyDraftIntro" type="button">放入介绍</button>
            <button id="applyDraftQuestions" type="button">放入题目</button>
            <button id="clearDraft" class="muted-button" type="button">清空草稿</button>
          </div>
        </section>

        <div class="ai-tools">
          <button id="aiExplain" type="button">AI 撰写解释</button>
          <button id="aiQuestions" type="button">AI 生成题目</button>
          <button id="saveNode" type="button">保存</button>
        </div>

        <section class="history-box">
          <div class="section-title-row">
            <h2>历史修改记录</h2>
            <span id="historyCount">0 条</span>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </section>

        <section class="hint-box">
          <h2>调试说明</h2>
          <p>当前 AI 按钮使用本地模拟函数，后续可替换为真实 API。地图画布支持拖动和平滑缩放。</p>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
